name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        # Without the health check the first migration races container startup
        # and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U app -d taskmanager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/taskmanager_test
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/taskmanager_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-32b
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Standalone smoke test of the migration chain, which is how Day 2's
      # container entrypoint will run it -- not redundant with the suite's own
      # schema fixture.
      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Test
        run: python -m pytest -v
